# Minimal all-in-one config for the unikernel build.
#
# Trimmed down from cmd/jaeger/internal/all-in-one.yaml:
#   * Badger on a mounted volume — the rootfs itself is read-only, so the
#     database lives at /data, which is where the volume is mounted.
#   * OTLP receiver only — the legacy jaeger/zipkin receivers (including the
#     Thrift UDP ports) are dropped to keep the number of listeners the
#     binary-compat layer has to service small.
#   * every endpoint binds 0.0.0.0; the unikernel's own loopback is not
#     reachable from the host.

service:
  extensions: [jaeger_storage, jaeger_query, healthcheckv2]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [jaeger_storage_exporter]
  telemetry:
    resource:
      service.name: jaeger
    metrics:
      level: basic
      readers:
        - pull:
            exporter:
              prometheus:
                host: 0.0.0.0
                port: 8888
    logs:
      level: info

extensions:
  healthcheckv2:
    use_v2: true
    http:
      endpoint: 0.0.0.0:13133

  jaeger_query:
    storage:
      traces: badgerstore
    http:
      endpoint: 0.0.0.0:16686
    grpc:
      endpoint: 0.0.0.0:16685

  jaeger_storage:
    backends:
      badgerstore:
        badger:
          directories:
            keys: /data/keys
            values: /data/values
          # ephemeral would put the database in a temp dir and throw it away on
          # restart, which is the whole thing this configuration exists to avoid.
          ephemeral: false
          ttl:
            # The volume is 256MiB and Badger fails writes once it is full, so
            # retention is bounded by time to keep it under that. Lower this
            # first if the volume fills.
            spans: 72h

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:

exporters:
  jaeger_storage_exporter:
    trace_storage: badgerstore
